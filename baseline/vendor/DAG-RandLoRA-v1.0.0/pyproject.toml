[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randlora-damage-encoder"
version = "1.3.0"
description = "Damage-aware gradient allocated full-rank RandLoRA adapters for official SAM1"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["randlora_damage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
